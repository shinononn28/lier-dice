<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>二枚舌の酒場</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/*BASECSS*/
.faces .mx{position:absolute;top:-6px;right:-5px;min-width:17px;height:17px;border-radius:9px;background:var(--ink);color:var(--bg);font-size:11px;line-height:17px;font-weight:700;padding:0 4px}
.cd{font-variant-numeric:tabular-nums;color:var(--red);font-weight:700;margin-left:6px}
.seat .off{font-size:11px;color:var(--muted);font-weight:500}
.mult{display:inline-block;background:var(--red);color:#fff;border-radius:6px;padding:0 6px;font-weight:700;font-size:12px;margin-left:4px}
.flip.chg .fb .die{box-shadow:0 0 0 2.5px var(--red)}
.dzm{font-size:30px;color:var(--brass);line-height:1.1;margin:4px 0;animation:dzin .4s cubic-bezier(.2,1.6,.4,1) both}
.dzm[hidden]{display:none}
.home .opt{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0;display:grid;gap:8px}
.home .opt h3{margin:0;font-size:15px}
.home .line2{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.home input.code{width:7em;text-transform:uppercase;letter-spacing:.15em;font-weight:700}
.members{display:grid;gap:4px;margin:8px 0}
.members div{display:flex;gap:6px;align-items:center}
.codebig{font-size:38px;letter-spacing:.12em;line-height:1.1}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;z-index:90;font-size:14px}
.thtabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.thtabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pickdie{display:flex;gap:6px;margin:8px 0}
.pickdie button{padding:4px;min-height:44px;min-width:44px;display:grid;place-items:center}
.pickdie button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink);border-color:var(--ink)}
.card small{display:block;font-size:10.5px;font-weight:500;line-height:1.2;opacity:.85}
.tabs button{padding:2px 9px}
.cardtab h4{margin:6px 0 4px;font-size:13px;color:var(--muted)}
.ct{width:100%;border-collapse:collapse;font-size:13.5px}
.ct td,.ct th{padding:5px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.ct th{font-size:11.5px;color:var(--muted);font-weight:500}
.ct .me td{background:color-mix(in srgb,var(--brass) 10%,transparent)}
.rchip{display:inline-block;font-size:11.5px;border:1px solid var(--line);border-radius:6px;padding:0 5px;margin:1px 2px 1px 0}
.elist{display:grid;gap:4px;font-size:13.5px}
.elist div{display:flex;gap:6px}.elist b{flex:none;min-width:2.6em;color:var(--brass);font-size:12px}
.mult.bon{background:var(--brass)}
.bonusl{margin-top:4px;font-weight:700;color:var(--brass)}
.pop{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.28);animation:popin .2s ease-out both}
.pop.out{opacity:0;transition:opacity .18s}
.popc{background:var(--panel);border:2px solid var(--ink);border-radius:16px;padding:16px 18px;min-width:220px;max-width:360px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.3);animation:popc .28s cubic-bezier(.2,1.5,.4,1) both}
.pop.priv .popc{border-color:var(--brass)}
.popc .pl{font-size:12px;color:var(--brass);font-weight:700}
.popc .pt{font-size:24px;line-height:1.25;margin:2px 0 6px}
.popc .pb{font-size:15px;line-height:1.55}
.popc .row{justify-content:center}
@keyframes popin{from{opacity:0}}
@keyframes popc{from{transform:scale(.85) rotate(-2deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.pop,.popc{animation:none}}
.mtrow{display:flex;align-items:center;gap:8px;margin:6px 0;flex-wrap:wrap}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="name disp">二枚舌の酒場</div>
    <div class="rt"><span id="round"></span>
      <button class="chatbtn" id="chatBtn" aria-label="会話と記録を開く">チャット<span class="badge" id="badge" hidden>0</span><span class="ndot" id="ndot" hidden></span></button>
      <button id="rulesBtn">ルール</button></div>
  </header>
  <section class="seats" id="seats" aria-label="卓の顔ぶれ"></section>
  <section class="board" aria-label="卓の中央"><div class="bmain" id="board" aria-live="polite"></div><div class="hist" id="hist"></div><div class="ticker" id="ticker" aria-live="polite"></div></section>
  <section class="mine" id="mine" aria-label="あなたの手元"></section>
</div>
<div class="chatwrap" id="chatWrap" hidden>
  <div class="chatpanel" role="dialog" aria-modal="true" aria-label="会話と記録">
    <div class="ch">
      <div class="tabs" role="tablist">
        <button role="tab" data-tab="talk" aria-selected="true">会話<span class="tb" id="tb-talk" hidden></span></button>
        <button role="tab" data-tab="glog" aria-selected="false">ログ</button>
        <button role="tab" data-tab="notes" aria-selected="false">手帳<span class="tb" id="tb-notes" hidden></span></button>
        <button role="tab" data-tab="cards" aria-selected="false">カード</button>
      </div>
      <button id="chatClose">閉じる</button>
    </div>
    <div class="log" id="talk" role="tabpanel"></div>
    <div class="log" id="glog" role="tabpanel" hidden></div>
    <div class="log" id="notes" role="tabpanel" hidden></div>
    <div class="log cardtab" id="cards" role="tabpanel" hidden></div>
    <div class="chatin" id="chatIn"><input id="chatInput" placeholder="発言する（例：ミレイは青だと思う）" maxlength="100" aria-label="チャット入力"><button id="chatSend">送る</button></div>
  </div>
</div>
<!--SOCKETIO-->
<!--ENGINE-->
<script>
/*CLIENT*/
</script>
</body>
</html>
